<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0718">
  <title>Blind Test · Buzzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Monoton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/base.css">
  <style>
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

    #join { margin: auto; width: min(420px, calc(100% - 32px)); display: grid; gap: 1rem; text-align: center; }
    #join .vinyl { width: 120px; margin: 0 auto; animation-play-state: running; animation-duration: 3s; }
    #join .vinyl .label { --label: linear-gradient(135deg, var(--pink), var(--violet)); color: white; font-size: 1.4rem; }
    #join h1 { margin: 0; font-size: 2.6rem; }
    #join input { text-align: center; font-size: 1.3rem; }
    #join .error { color: var(--red); min-height: 1.2em; margin: 0; }

    #game { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; min-height: 0; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .me { display: flex; align-items: center; gap: 0.5em; font-weight: 800; overflow: hidden; }
    .me .swatch { width: 1em; height: 1em; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
    .me span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* The whole area is the button; the record in the middle shows the state. */
    #buzz {
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 0.5rem;
      border-radius: 32px;
      color: var(--text);
      background: transparent;
      box-shadow: none;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    #buzz:active { transform: none; }
    /* The record spins; the text sits on top of it and stays level. */
    #buzz .disc { --label: var(--grey); position: relative; width: min(84vw, 56vh); display: grid; place-items: center; }
    #buzz .disc > * { grid-area: 1 / 1; }
    #buzz .vinyl { width: 100%; transition: box-shadow 0.25s ease, transform 0.1s ease; }
    #buzz .vinyl .label { width: 58%; transition: background 0.25s ease; }
    #buzz .vinyl .label::after { display: none; }
    #buzz .big { position: relative; max-width: 50%; color: #1a0f2e; font-family: var(--title-font); font-size: clamp(1.8rem, 11vw, 3.8rem); line-height: 1; overflow-wrap: anywhere; }
    #buzz .big.long { font-size: clamp(1.2rem, 7vw, 2.4rem); }
    #buzz .small { font-size: 1.15rem; font-weight: 600; max-width: 26ch; min-height: 2.6em; }
    #buzz.waiting .big { color: var(--text); }
    #buzz.armed .vinyl { animation-play-state: running; animation-duration: 2.6s; box-shadow: 0 0 0 6px var(--label), 0 0 60px var(--label), 0 24px 60px rgba(0, 0, 0, 0.6); }
    #buzz.armed:active .vinyl { transform: scale(0.96); }
    #buzz.hand .disc { --label: var(--green); }
    #buzz.hand .vinyl { animation: pulse 1.1s infinite; }
    #buzz.late .disc { --label: var(--orange); }
    #buzz.locked .disc { --label: var(--red); }
    #buzz.locked .big { color: white; }
    #buzz.flash .vinyl { animation: shake 0.3s; }
    #buzz.win .disc { --label: var(--accent); }
    #buzz.win .vinyl { animation-play-state: running; box-shadow: 0 0 60px rgba(255, 201, 60, 0.6), 0 24px 60px rgba(0, 0, 0, 0.6); }

    .timer { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    .timer > div { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--pink), var(--accent)); box-shadow: 0 0 12px var(--pink); }
    .footer { display: flex; justify-content: space-between; color: var(--muted); font-weight: 600; }
    #score { color: var(--accent); }
    #conn.warn { color: var(--orange); }
  </style>
</head>
<body>
  <form id="join" class="hidden">
    <div class="sheen vinyl"><div class="label">♪</div></div>
    <h1 class="neon">Blind Test</h1>
    <p class="muted">Salle <strong id="join-code"></strong>. Choisis un pseudo dont tu n'auras pas honte quand l'animateur va le prononcer.</p>
    <input id="name" maxlength="20" placeholder="Ton pseudo" autocomplete="nickname" required>
    <button type="submit">Rejoindre</button>
    <p class="error" id="join-error"></p>
  </form>

  <main id="game" class="hidden">
    <div class="topbar">
      <div class="me"><span class="swatch" id="me-color"></span><span id="me-name"></span></div>
      <span class="pill" id="progress"></span>
    </div>
    <div class="timer" aria-hidden="true"><div id="timer-bar"></div></div>
    <button id="buzz" class="waiting" aria-live="polite">
      <span class="disc" id="disc">
        <span class="vinyl"><span class="label"></span></span>
        <span class="big" id="buzz-big">…</span>
      </span>
      <span class="small" id="buzz-small"></span>
    </button>
    <div class="footer">
      <span id="score">0 pt</span>
      <span id="conn"></span>
    </div>
  </main>

  <script type="module" src="/static/play.js"></script>
</body>
</html>
